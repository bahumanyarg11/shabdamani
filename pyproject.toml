[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shabdamani"
version = "0.1.0"
description = "A rule engine for Kēśirāja's Śabdamaṇidarpaṇa (Old Kannada grammar): derivations with sūtra-by-sūtra traces."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
shabdamani = "shabdamani.cli:main"

[tool.setuptools]
packages = ["shabdamani"]

[tool.setuptools.package-data]
shabdamani = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
